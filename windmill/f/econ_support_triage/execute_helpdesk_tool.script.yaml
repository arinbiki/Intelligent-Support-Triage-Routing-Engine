summary: 'Helpdesk Dispatcher & Audit Logger'
description: 'Applies tags, assigns queue, posts internal audit note to Zendesk/Gorgias/Slack, and records decision to SQLite audit ledger.'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    ticket_id:
      type: string
    department:
      type: string
    confidence:
      type: number
    urgency_level:
      type: string
    urgency_score:
      type: integer
    kill_switch_triggered:
      type: boolean
    assigned_queue:
      type: string
    applied_tags:
      type: array
      items:
        type: string
    sla_minutes:
      type: integer
    requires_human_approval:
      type: boolean
    sentiment_compound:
      type: number
      default: 0.0
    sentiment_negative:
      type: number
      default: 0.0
    refund_intent_detected:
      type: boolean
      default: false
    refund_order_id:
      type: string
      default: null
    return_eligible:
      type: boolean
      default: null
    trigger_keywords:
      type: array
      items:
        type: string
      default: []
    customer_tier:
      type: string
      default: 'Standard'
    n8n_webhook_url:
      type: string
      default: null
    mock_mode:
      type: boolean
      default: true
  required:
    - ticket_id
    - department
    - confidence
    - urgency_level
    - urgency_score
    - kill_switch_triggered
    - assigned_queue
    - applied_tags
    - sla_minutes
    - requires_human_approval
